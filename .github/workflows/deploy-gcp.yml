name: Deploy GCP

on:
  workflow_dispatch:
    inputs:
      region:
        description: GCP region.
        required: true
        default: europe-west2
      apply:
        description: Apply the Terraform plan.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  TERRAFORM_DIR: v2/deployment/cloud/gcp
  SERVICE_IMAGE_NAME: api

jobs:
  deploy:
    name: Manual GCP deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Define image
        id: image
        run: |
          IMAGE="${{ inputs.region }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/hybrid-search-v2/${SERVICE_IMAGE_NAME}:${GITHUB_SHA}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GCP_TERRAFORM_STATE_BUCKET }}" \
            -backend-config="prefix=hybrid-search/v2/${{ inputs.region }}"

      - name: Bootstrap Artifact Registry
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform apply \
            -target=google_project_service.required \
            -target=google_artifact_registry_repository.api \
            -auto-approve \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ inputs.region }}" \
            -var="billing_account_id=${{ secrets.GCP_BILLING_ACCOUNT_ID }}" \
            -var="alert_email=${{ vars.ALERT_EMAIL }}" \
            -var="api_image=${{ steps.image.outputs.image }}"

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ inputs.region }}-docker.pkg.dev --quiet

      - name: Build API image
        run: docker build -t "${{ steps.image.outputs.image }}" -f v2/deployment/api/Dockerfile v2

      - name: Push API image
        run: docker push "${{ steps.image.outputs.image }}"

      - name: Terraform plan
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform plan \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ inputs.region }}" \
            -var="billing_account_id=${{ secrets.GCP_BILLING_ACCOUNT_ID }}" \
            -var="alert_email=${{ vars.ALERT_EMAIL }}" \
            -var="api_image=${{ steps.image.outputs.image }}" \
            -out=tfplan

      - name: Terraform apply
        if: ${{ inputs.apply }}
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Smoke check
        if: ${{ inputs.apply }}
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          API_URL="$(terraform output -raw api_url)"
          curl -fsS "${API_URL}/health/live"
          curl -fsS "${API_URL}/rollout/status"
