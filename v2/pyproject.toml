[project]
name = "hybrid-search-v2"
version = "0.1.0"
description = "Bounded production-aware hybrid search API."
readme = "README.md"
authors = [
    { name = "settorka", email = "amedikusettor@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "elasticsearch[async]>=8.17.0,<9.0.0",
    "fastapi>=0.115.0",
    "faker>=33.0.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "prometheus-client>=0.21.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
